# config.yaml

fastq_ext: ".fastq"
read1: "_1"
read2: "_2"
cores: 2

run_variant_calling: false 
run_gene_qunatification: false
run_deseq2: false

fastq_dir: "fastq_files"
resource_dir: "resources"
output_dir: "outputs"
sam_files_output: "sam_files"
bam_files_output: "bam_files"
vcf_files_output: "vcf_files"
count_files_output: "counts"
samplesheet: "samplesheet.csv"

directories:
  fasta_reference: "resources/Homo_sapiens.GRCh38.dna.primary_assembly.fa"
  gtf_file: "resources/Homo_sapiens.GRCh38.115.chr.gtf"
  genome_reference_index: "resources/indexed_reference/hg38_reference"


